# What every change to Booker has to survive. One job per concern, each named
# for what it proves, so a red run says which rule was broken without anyone
# opening the log.
#
# Budget rules (docs/waves/wave-0.5.md):
#   * No scheduled jobs. Everything runs on a push to main or on a pull
#     request. `cargo xtask eval` costs model time and stays a by-hand command.
#   * Checks that cannot differ between platforms run once, on Linux.
#   * The test matrix widens to macOS and Windows only for pull requests into
#     main — the wave pull requests, which is where AGENTS.md §4 wants the
#     three-platform evidence.
#
# The Rust version is never named here: it comes from rust-toolchain.toml, so
# there is one place to change it.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # CI builds are one-shot: incremental artifacts are never reused and only
  # make the cache bigger.
  CARGO_INCREMENTAL: 0

jobs:
  # Which parts of the tree this change touches. The application's jobs
  # need Node and a pnpm install, which a Rust-only change should not pay
  # for (docs/waves/wave-1.md, track D).
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Enough history to diff against the base of the pull request.
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # A push to main rebuilds everything: it is what the release
            # is cut from, so nothing is skipped there.
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD)
          echo "$changed"
          # The contracts are what the TypeScript types are generated from,
          # so a change to them is a change to the application too.
          if echo "$changed" | grep -qE '^(app/|crates/booker-core/|\.github/workflows/ci\.yml)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup component add rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup component add clippy
      - uses: ./.github/actions/tauri-system-deps
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    # Linux on every push and pull request; all three platforms on pull
    # requests into main, because that is where a wave is judged.
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && github.base_ref == 'main' && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/tauri-system-deps
        if: runner.os == 'Linux'
      - uses: Swatinem/rust-cache@v2
      # --no-fail-fast because one platform-specific failure in an early
      # test binary would otherwise hide every later one, and a Windows run
      # costs five minutes to find out one fact at a time.
      - name: Tests
        run: cargo test --workspace --all-targets --locked --no-fail-fast
      # --all-targets does not run doc tests. This is the second half of
      # `cargo test`, not an extra.
      - name: Doc tests
        run: cargo test --workspace --doc --locked

  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/tauri-system-deps
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --locked

  bindings:
    name: bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      # The TypeScript bindings are generated, never committed. This proves
      # the contracts still export cleanly, which is what the application
      # will depend on from Wave 1 on.
      - run: cargo test -p booker-core --locked export_bindings

  app:
    name: app
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          # One place says which Node this is built with.
          node-version-file: .tool-versions
      # The corepack that ships with Node 20 cannot verify the registry
      # signature on a current pnpm, and fails in a way that looks like a
      # broken install rather than a signature problem: it reports
      # `Cannot find module …/pnpm.cjs`. Updating it first is what
      # CONTRIBUTING.md tells a person to do, so CI does the same.
      - name: Enable pnpm
        run: |
          npm install -g corepack@latest
          corepack enable pnpm
      - uses: Swatinem/rust-cache@v2
      # The TypeScript types are generated from the Rust contracts and are
      # not committed, so nothing below typechecks without this first.
      - name: Generate the bindings
        working-directory: .
        run: cargo test -p booker-core --locked export_bindings
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      # The JavaScript half of THIRD-PARTY.md needs the installed
      # node_modules, which only this job has; `deps` checks the rest.
      - name: Third-party notices are current (JavaScript)
        run: cargo xtask third-party --check --only javascript
      # A bundle that does not build is a release that does not happen.
      - run: pnpm build

  deps:
    name: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Wave 0's integration merged two tracks' dependency lines cleanly and
      # produced a manifest that failed to parse. A textual merge cannot see
      # that; this can.
      - name: Workspace manifests parse
        run: cargo metadata --locked --format-version 1 > /dev/null
      # Advisories, licences, duplicate versions and where crates come from.
      # The licence data is also what THIRD-PARTY.md is assembled from.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources advisories
      # THIRD-PARTY.md is assembled from the same licence data, so a new
      # dependency that nobody regenerated it for is caught here rather
      # than shipped with notices that do not describe the build.
      - name: Install cargo-deny
        run: |
          version=0.20.2
          curl -fsSL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${version}/cargo-deny-${version}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin "cargo-deny-${version}-x86_64-unknown-linux-musl/cargo-deny"
      - name: Third-party notices are current (fonts and Rust crates)
        run: cargo xtask third-party --check --only rust
