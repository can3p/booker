[workspace]
resolver = "2"
members = [
    "crates/booker-core",
    "crates/booker-project",
    "crates/booker-doc",
    "crates/booker-typst",
    "crates/booker-cli",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"   # Typst 0.15.1 requires it
license = "MIT"
repository = "https://github.com/can3p/booker"

[workspace.dependencies]
booker-core = { path = "crates/booker-core" }
booker-doc = { path = "crates/booker-doc" }
booker-project = { path = "crates/booker-project" }
booker-typst = { path = "crates/booker-typst" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "1"
toml = "0.8"
toml_edit = "0.22"
ts-rs = "9"

# Wave 0 track C (booker-typst). The Typst version is pinned exactly: Typst is
# pre-1.0, its layout changes between releases, and the golden suite is what
# gates an upgrade. Bump these five together, never one of them.
comemo = "0.5"
typst = "=0.15.1"
typst-kit = { version = "=0.15.1", default-features = false, features = ["datetime"] }
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
typst-render = "=0.15.1"
typst-svg = "=0.15.1"
