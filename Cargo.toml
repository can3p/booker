[workspace]
resolver = "2"
members = [
    "crates/booker-core",
    "crates/booker-project",
    "crates/booker-doc",
    "crates/booker-typst",
    "crates/booker-cli",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/can3p/booker"

[workspace.dependencies]
booker-core = { path = "crates/booker-core" }
booker-doc = { path = "crates/booker-doc" }
booker-project = { path = "crates/booker-project" }
booker-typst = { path = "crates/booker-typst" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
toml = "0.8"
ts-rs = "9"
