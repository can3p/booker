[package]
name = "booker-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The Booker desktop application: a window around the same core the CLI uses."
# Part of the Booker application, not a library published on its own.
publish = false

[lib]
# The bundle's entry point is a thin `main.rs` over this library, so the
# commands can be tested without starting a window.
name = "booker_app"
path = "src/lib.rs"

[[bin]]
name = "booker-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
booker-core = { workspace = true }
booker-doc = { workspace = true }
booker-project = { workspace = true }
booker-typst = { workspace = true }
notify = { workspace = true }
notify-debouncer-full = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-updater = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# `tauri::test` builds an application without a window, which is how the
# `booker://` protocol handler is tested against a real book.
tauri = { workspace = true, features = ["test"] }
