[package]
name = "booker-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The Booker command line: the same core as the app, without the app."
# Part of the Booker application, not a library published on its own.
publish = false

[lib]
name = "booker_cli"
path = "src/lib.rs"

[[bin]]
name = "booker"
path = "src/main.rs"

[dependencies]
booker-core = { workspace = true }
booker-doc = { workspace = true }
booker-project = { workspace = true }
booker-typst = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
