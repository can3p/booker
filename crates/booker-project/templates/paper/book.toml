# This is your paper. Everything here can be changed by hand, by the
# Booker app, or by an agent working in this folder — it is plain text on
# purpose, and Booker keeps your comments and your key order when it writes.

format = {{format}}          # the project format; Booker migrates this for you
title = "{{title}}"
# author = "Your name here"
language = "en"
theme = "paper"   # sections follow each other without page breaks

chapters = [
    "content/01-the-paper.md",
]

[page]
size = "a4"
facing = false     # printed on one side: the margins stay where they are

[page.margins]
top = "25mm"
bottom = "25mm"
inside = "25mm"
outside = "25mm"
