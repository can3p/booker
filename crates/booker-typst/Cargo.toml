[package]
name = "booker-typst"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Booker's layout engine: a Typst World over a project folder, compiled and rendered in process."
# Part of the Booker application, not a library published on its own.
publish = false

[dependencies]
booker-core = { workspace = true }
booker-doc = { workspace = true }
comemo = { workspace = true }
typst = { workspace = true }
typst-kit = { workspace = true }
typst-layout = { workspace = true }
typst-pdf = { workspace = true }
typst-render = { workspace = true }
typst-svg = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# `book`'s tests build a BookConfig from the TOML a user would write.
toml = { workspace = true }
